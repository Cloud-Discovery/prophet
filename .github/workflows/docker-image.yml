name: Docker Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Build the Docker image
      uses: actions/checkout@v2
      
    - name: Run frontent docker build
      run: docker build . --file Dockerfile.frontend --tag oneprocloud/prophet-frontent:latest

    - name: Run backend docker build
      run: docker build . --file Dockerfile.backend --tag oneprocloud/prophet-backend:latest
      
    - name: Tag frontent Aliyun
      run: docker tag oneprocloud/prophet-frontent:latest registry.cn-beijing.aliyuncs.com/oneprocloud-opensource/prophet-frontent:latest
      
    - name: Tag backend Aliyun
      run: docker tag oneprocloud/prophet-backend:latest registry.cn-beijing.aliyuncs.com/oneprocloud-opensource/prophet-backend:latest
      
    - name: Login dockerhub
      env:
        USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        docker login -u "$USERNAME" -p "$TOKEN"
      
    - name: Push prophet-frontent to dockerhub
      run: docker push oneprocloud/prophet-frontent:latest

    - name: Push prophet-backend to dockerhub
      run: docker push oneprocloud/prophet-backend:latest
      
    - name: Login Aliyun dockerhub
      env:
        USERNAME: ${{ secrets.ALIYUN_DOCKERHUB_USERNAME }}
        PASSWORD: ${{ secrets.ALIYUN_DOCKERHUB_PASSWORD }}
      run: |
        docker login -u "$USERNAME" -p "$PASSWORD" registry.cn-beijing.aliyuncs.com
      
    - name: Push prophet-frontent to aliyun dockerhub
      run: docker push registry.cn-beijing.aliyuncs.com/oneprocloud-opensource/prophet-frontent:latest

    - name: Push prophet-backend to aliyun dockerhub
      run: docker push registry.cn-beijing.aliyuncs.com/oneprocloud-opensource/prophet-backend:latest
